worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # Never log query strings: Subsonic URLs carry passwords/tokens/API keys.
  log_format transfers escape=json '{"method":"$request_method","path":"$uri",'
    '"status":$status,"bytes_sent":$body_bytes_sent,"duration":$request_time,'
    '"upstream_status":"$upstream_status","upstream_duration":"$upstream_response_time",'
    '"request_id":"$upstream_http_x_request_id"}';
  access_log /dev/stdout transfers;
  sendfile      on;
  keepalive_timeout 65;

  # Docker's embedded DNS with a short TTL. Upstream hostnames below are only
  # referenced through variables, so nginx re-resolves them per request
  # instead of pinning the container IP from gateway startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Prefer the client-facing scheme from an upstream proxy (Traefik).
  # Without this, $scheme is always "http" here and Secure cookies break.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # Preserve streaming / range responses
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Connection "";

  map $request_uri $disable_buffering {
    default 0;
    ~*/rest/(stream|download|getCoverArt) 1;
    ~*/api/(stream|media|cover) 1;
  }

  server {
    listen 80;
    client_max_body_size 10g;

    # Variables (not static URLs) so each request re-resolves api/web via the
    # resolver above. A static proxy_pass is resolved once at startup and keeps
    # dialing the dead IP after the api container is recreated (every deploy),
    # which surfaces as a permanent 502 until the gateway itself restarts.
    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    location /rest/ {
      proxy_pass $api_upstream;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header X-Accel-Buffering no;
    }

    location /api/ {
      proxy_pass $api_upstream;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header X-Accel-Buffering no;
    }

    location /health {
      proxy_pass $api_upstream;
    }

    location / {
      proxy_pass $web_upstream;
      proxy_buffering on;
    }
  }
}
