worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  # Never log query strings: Subsonic URLs carry passwords/tokens/API keys.
  log_format transfers escape=json '{"method":"$request_method","path":"$uri",'
    '"status":$status,"bytes_sent":$body_bytes_sent,"duration":$request_time,'
    '"upstream_status":"$upstream_status","upstream_duration":"$upstream_response_time",'
    '"request_id":"$upstream_http_x_request_id"}';
  access_log /dev/stdout transfers;
  sendfile      on;
  keepalive_timeout 65;

  # Prefer the client-facing scheme from an upstream proxy (Traefik).
  # Without this, $scheme is always "http" here and Secure cookies break.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  # Preserve streaming / range responses
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_set_header Connection "";

  map $request_uri $disable_buffering {
    default 0;
    ~*/rest/(stream|download|getCoverArt) 1;
    ~*/api/(stream|media|cover) 1;
  }

  server {
    listen 80;
    client_max_body_size 32m;

    location /rest/ {
      proxy_pass http://api:8000/rest/;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header X-Accel-Buffering no;
    }

    location /api/ {
      proxy_pass http://api:8000/api/;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_set_header X-Accel-Buffering no;
    }

    location /health {
      proxy_pass http://api:8000/health;
    }

    location / {
      proxy_pass http://web:3000/;
      proxy_buffering on;
    }
  }
}
